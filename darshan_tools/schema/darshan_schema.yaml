# -----------------------------------------------------------------------------
# STORAGE -- where the bytes landed (static layout, no I/O counts)
# -----------------------------------------------------------------------------
storage:
  LUSTRE:
    user_cares: "Whether striping matches the I/O pattern, and which OSTs are shared (contention)."
    grain: "Per file record."
    fields:
      LUSTRE_STRIPE_SIZE:   { type: int,  unit: bytes, desc: "Stripe size." }
      LUSTRE_STRIPE_WIDTH:  { type: int,  unit: count, desc: "Stripe count (OSTs the file spans)." }
      LUSTRE_STRIPE_OFFSET: { type: int,  unit: id,    desc: "Starting OST index." }
      LUSTRE_OSTS:          { type: int,  unit: count, desc: "Total OSTs in the filesystem." }
      LUSTRE_MDTS:          { type: int,  unit: count, desc: "Total MDTs in the filesystem." }
      # Indexed family: one counter per OST the file uses, i = 0 .. (LUSTRE_STRIPE_WIDTH - 1).
      # Names are literal: LUSTRE_OST_ID_0, LUSTRE_OST_ID_1, LUSTRE_OST_ID_2, ...
      LUSTRE_OST_ID_{i}:    { type: int,  unit: id,    indexed: "i = 0 .. LUSTRE_STRIPE_WIDTH-1", desc: "OST index of the i-th stripe (literal names LUSTRE_OST_ID_0, LUSTRE_OST_ID_1, ...); for contention analysis." }

# -----------------------------------------------------------------------------
# TRACES -- fine-grained, only present when explicitly enabled
# -----------------------------------------------------------------------------
traces:
  DXT:
    user_cares: "Exactly when and where every I/O happened -- timelines, bursts, per-OST mapping."
    layer: "Darshan eXtended Tracing (DXT_POSIX, DXT_MPIIO). Not aggregated: one row per operation."
    grain: "Per operation, per rank."
    fields:
      rank:       { type: int,    unit: id,            desc: "Issuing rank." }
      hostname:   { type: string, unit: text,          desc: "Host that issued the op (build-dependent)." }
      operation:  { type: enum,   unit: "read|write",  desc: "I/O direction." }
      offset:     { type: int,    unit: bytes_offset,  desc: "Byte offset in file." }
      length:     { type: int,    unit: bytes,         desc: "Bytes moved." }
      start_time: { type: float,  unit: seconds,       desc: "Start (from job start)." }
      end_time:   { type: float,  unit: seconds,       desc: "End (from job start)." }

  HEATMAP:
    user_cares: "Compact view of I/O intensity over time across ranks -- spot bursts and idle gaps without full DXT."
    layer: "Time-binned rank x time intensity (per module: POSIX/MPIIO/STDIO)."
    grain: "Per (rank, time-bin)."
    fields:
      nbins:         { type: int, unit: count, desc: "Number of time bins." }
      bin_width_s:   { type: float, unit: seconds, desc: "Bin width." }
      rank:          { type: int, unit: id,    desc: "Rank." }
      bin_index:     { type: int, unit: count, desc: "Time-bin index." }
      bytes_read:    { type: int, unit: bytes, desc: "Bytes read in this bin." }
      bytes_written: { type: int, unit: bytes, desc: "Bytes written in this bin." }

# -----------------------------------------------------------------------------
# INSIGHTS -- derived answers (computed, not raw counters). These are what an
# analysis agent typically reports; each notes the inputs it is derived from.
# -----------------------------------------------------------------------------
insights:
  user_cares: "The bottom line: is this job's I/O healthy AT THIS SCALE, how close is it to what the system can do, and if not, why?"

  # --- Raw achieved rates -----------------------------------------------------
  throughput:
    read_bandwidth_MiBps:    { unit: MiB/s,   from: "BYTES_READ / F_READ_TIME",              desc: "Effective read throughput." }
    write_bandwidth_MiBps:   { unit: MiB/s,   from: "BYTES_WRITTEN / F_WRITE_TIME",          desc: "Effective write throughput." }
    aggregate_bandwidth_MiBps: { unit: MiB/s, from: "(BYTES_READ+BYTES_WRITTEN) / (F_READ_TIME+F_WRITE_TIME)", desc: "Combined I/O throughput." }
    metadata_rate_opsps:     { unit: ops/s,   from: "(insights.behavior.distinct_opens + POSIX_STATS + POSIX_SEEKS) / POSIX_F_META_TIME", desc: "Achieved metadata op rate. Uses distinct opens, not the raw POSIX_OPENS counter." }

  # --- Pattern / behavior quality --------------------------------------------
  behavior:
    posix_io_coretime_share: { unit: ratio,   from: "POSIX (F_READ_TIME+F_WRITE_TIME+F_META_TIME) / (job.run_time * job.nprocs_total)", desc: "POSIX-only. Rank-seconds of I/O over rank-seconds available. STDIO/MPI-IO time is excluded and can exceed it." }
    metadata_overhead:       { unit: ratio,   from: "POSIX F_META_TIME / POSIX total_io_time", desc: "POSIX-only. Time lost to opens/stats/seeks." }
    small_access_ratio:      { unit: ratio,   from: "sum(SIZE_*_0_100, SIZE_*_100_1K, SIZE_*_1K_10K) / (READS + WRITES)", desc: "Fraction of accesses under 10 KiB (red flag)." }
    sequential_ratio:        { unit: ratio,   from: "(SEQ_READS + SEQ_WRITES) / (READS + WRITES)", desc: "Sequential vs random access." }
    unaligned_ratio:         { unit: ratio,   from: "FILE_NOT_ALIGNED / (READS + WRITES)",   desc: "Fraction of misaligned accesses." }
    collective_ratio:        { unit: ratio,   from: "(COLL_READS+COLL_WRITES) / (COLL_READS+COLL_WRITES+INDEP_READS+INDEP_WRITES)", desc: "MPI-IO collective usage (higher is better at scale)." }
    file_access_mode:        { unit: enum,    from: "record rank distribution",              desc: "shared-file | file-per-process | mixed." }
    distinct_opens:          { unit: count,   from: "POSIX_OPENS - POSIX_FILENOS - POSIX_DUPS", desc: "Real open() calls, with the counters POSIX_OPENS folds in removed." }
    redundant_open_ratio:    { unit: ratio,   from: "insights.behavior.distinct_opens / modules.POSIX_IO.n_files", desc: "Excessive re-opening of files." }

  # --- Scale-aware: normalize achieved I/O by the run's shape ------------------
  # These turn absolute counters into per-unit rates so a number can be judged
  # against the run's layout (from the JOB section).
  scale_normalized:
    bytes_per_rank:          { unit: bytes,   from: "(BYTES_READ+BYTES_WRITTEN) / job.nprocs_total",        desc: "I/O volume carried per rank." }
    bytes_per_node:          { unit: bytes,   from: "(BYTES_READ+BYTES_WRITTEN) / job.num_nodes",           desc: "I/O volume per node (pairs with per_node_bw)." }
    bw_per_rank_MiBps:       { unit: MiB/s,   from: "aggregate_bandwidth_MiBps / job.nprocs_total",         desc: "Throughput contributed per rank." }
    bw_per_node_MiBps:       { unit: MiB/s,   from: "aggregate_bandwidth_MiBps / job.num_nodes",            desc: "Throughput per node." }
    opens_per_rank:          { unit: count,   from: "insights.behavior.distinct_opens / job.nprocs_total",                             desc: "Metadata pressure per rank (many ranks x many opens = MDS storm)." }

  # --- Efficiency vs rated peak: the actual "is this good?" verdict -----------
  # Requires system.rated_peak_performance. Each is achieved / reference-ceiling;
  # ~1.0 means near hardware limit, low values indicate headroom / a problem.
  efficiency:
    read_bw_efficiency:      { unit: ratio,   from: "read_bandwidth_MiBps / (system.rated_peak_performance.measured_ior_bw or system.rated_peak_performance.peak_read_bw)",   desc: "Fraction of achievable read bandwidth realized." }
    write_bw_efficiency:     { unit: ratio,   from: "write_bandwidth_MiBps / (system.rated_peak_performance.measured_ior_bw or system.rated_peak_performance.peak_write_bw)", desc: "Fraction of achievable write bandwidth realized." }
    metadata_rate_efficiency: { unit: ratio,  from: "metadata_rate_opsps / system.rated_peak_performance.peak_metadata_rate",                    desc: "Fraction of the filesystem's metadata capacity used." }
    node_bw_saturation:      { unit: ratio,   from: "bw_per_node_MiBps / system.rated_peak_performance.per_node_bw",                             desc: ">1 impossible; near 1 means node NIC/injection-bound, not FS-bound." }
    io_bound_verdict:        { unit: enum,    from: "posix_io_coretime_share + metadata_overhead + small_access_ratio", desc: "healthy | metadata_bound | pattern_bound | io_intensive | unknown | unknown_non_posix_dominant (STDIO/MPI-IO time >1.25x POSIX, so a POSIX-derived ruling would cover a minority of the job's I/O)." }
